user nginx;

daemon off;
error_log /dev/stdout warn;
worker_processes 2;
pcre_jit on;

include /etc/nginx/modules/*.conf;
include /etc/nginx/conf.d/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 16m;
    sendfile on;
    tcp_nopush on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    gzip on;
    gzip_vary on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    access_log /dev/stdout;

    server {
        listen 80;
        server_name _;
        root /var/www/webtlo/public;
        index index.php;

        # Sanitized counters are served by a separate worker, not the application pool.
        location = /php/worker_status.php {
            limit_except GET { deny all; }
            try_files $uri =404;
            include /etc/nginx/fastcgi.conf;
            fastcgi_pass 127.0.0.1:9002;
            fastcgi_read_timeout 3s;
            access_log off;
        }

        location ~ \.php$ {
            try_files $uri =404;

            include /etc/nginx/fastcgi.conf;

            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 3600;
            fastcgi_send_timeout 3600;
            fastcgi_connect_timeout 3600;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }
    }

    # The original FPM status is only reachable from inside the container.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        access_log off;

        location = /fpm-status {
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_param SCRIPT_FILENAME /fpm-status;
            fastcgi_param SCRIPT_NAME /fpm-status;
            fastcgi_param QUERY_STRING json;
            fastcgi_param REQUEST_METHOD GET;
        }

        location / {
            return 404;
        }
    }
}
